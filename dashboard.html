<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration dashboard | HackStart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#18221c;--muted:#66736a;--paper:#f7f8f5;--surface:#fff;--line:#dce2db;--green:#176b43;--green-dark:#104c30;--coral:#bc4d38}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}.page{width:min(100% - 2rem,1200px);margin:auto;padding:2rem 0 4rem}
    .topline{display:flex;justify-content:space-between;padding-bottom:1rem;border-bottom:1px solid var(--line)}.brand,.back{color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none}.brand{display:flex;align-items:center;gap:.6rem}.mark{display:grid;width:2rem;aspect-ratio:1;place-items:center;border-radius:5px;background:var(--green);color:#fff}.back{color:var(--green-dark)}
    .intro{padding:2.5rem 0 1.5rem}.eyebrow{margin:0 0 .6rem;color:var(--green);font-size:.75rem;font-weight:700;text-transform:uppercase}h1{margin:0;font:500 clamp(2.2rem,7vw,3.5rem)/1.05 'Fraunces',Georgia,serif}
    .toolbar{display:flex;align-items:end;gap:.75rem;flex-wrap:wrap;padding:1rem 0;border-top:1px solid var(--line)}.field{display:grid;min-width:min(100%,320px);gap:.4rem}label{font-size:.85rem;font-weight:600}input{min-height:2.7rem;padding:.65rem .75rem;border:1px solid #cbd4cb;border-radius:4px;font:inherit}input:focus{outline:3px solid #e4f1e8;border-color:var(--green)}button{min-height:2.7rem;padding:.65rem 1rem;border:0;border-radius:4px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--green-dark)}button:disabled{opacity:.65;cursor:wait}
    #status{min-height:1.4em;margin:.3rem 0 1rem;color:var(--muted);font-size:.9rem}#status[data-state=error]{color:var(--coral)}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px;background:var(--surface)}table{width:100%;border-collapse:collapse;text-align:left}th,td{min-width:125px;padding:.85rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.88rem}th{background:#edf3ed;color:#34443a;font-size:.75rem;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.team{font-weight:700}.subtle{display:block;margin-top:.25rem;color:var(--muted);font-size:.82rem}ul{margin:0;padding-left:1.1rem}li+li{margin-top:.2rem}
    @media(max-width:560px){.page{width:min(100% - 1.25rem,1200px);padding-top:1rem}.toolbar{align-items:stretch}.toolbar button{width:100%}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topline"><a class="brand" href="/index.html"><span class="mark" aria-hidden="true">H</span>HackStart</a><a class="back" href="/index.html">Back to home</a></header>
    <section class="intro"><p class="eyebrow">HackStart · Organizer tools</p><h1>Team registrations</h1></section>
    <form class="toolbar" id="dashboardForm"><div class="field"><label for="adminToken">Dashboard access token</label><input id="adminToken" type="password" autocomplete="off" required></div><button id="loadButton" type="submit">Load registrations</button></form>
    <p id="status" role="status" aria-live="polite">Enter the admin token to review registrations.</p>
    <div class="table-wrap"><table><thead><tr><th>Team</th><th>Team lead</th><th>Participants</th><th>Topic</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table></div>
  </main>
  <script>
    const form=document.querySelector("#dashboardForm"),token=document.querySelector("#adminToken"),button=document.querySelector("#loadButton"),status=document.querySelector("#status"),rows=document.querySelector("#rows");
    function cell(row,text,className){const item=document.createElement("td");item.textContent=text;if(className)item.className=className;row.append(item);return item;}
    form.addEventListener("submit",async event=>{
      event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.dataset.state="";status.textContent="Loading registrations...";
      try{const response=await fetch("/api/participants",{headers:{"Authorization":`Bearer ${token.value.trim()}`}});const registrations=await response.json();if(!response.ok)throw new Error(registrations.error||`Request failed (${response.status})`);rows.replaceChildren();
        for(const registration of registrations){const row=document.createElement("tr");cell(row,registration.teamName,"team");const lead=cell(row,"");const leadName=document.createElement("span");leadName.textContent=registration.teamLead.name;const contact=document.createElement("span");contact.className="subtle";contact.textContent=`${registration.teamLead.email} · ${registration.teamLead.phone}`;lead.append(leadName,contact);const list=document.createElement("ul");for(const person of registration.participants){const item=document.createElement("li");item.textContent=`${person.name} · ${person.phone}`;list.append(item);}const peopleCell=document.createElement("td");peopleCell.append(list);row.append(peopleCell);cell(row,registration.topic==="open-track"?"Open track":registration.topic.toUpperCase());cell(row,new Date(registration.createdAt).toLocaleString());rows.append(row);}
        status.textContent=`${registrations.length} registration${registrations.length===1?"":"s"} loaded.`;
      }catch(error){rows.replaceChildren();status.dataset.state="error";status.textContent=error.message||"Could not load registrations.";}finally{button.disabled=false;}
    });
  </script>
</body>
</html>
