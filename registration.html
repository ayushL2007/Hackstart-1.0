<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Team registration | HackStart</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
	<style>
		:root{--ink:#18221c;--muted:#66736a;--paper:#f7f8f5;--surface:#fff;--line:#dce2db;--green:#176b43;--green-dark:#104c30;--coral:#bc4d38}
		*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
		.page{width:min(100% - 2rem,820px);margin:auto;padding:2rem 0 4rem}.topline{display:flex;justify-content:space-between;gap:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}
		.brand,.back{color:var(--ink);font-size:.9rem;font-weight:700;text-decoration:none}.brand{display:flex;align-items:center;gap:.6rem}.mark{display:grid;width:2rem;aspect-ratio:1;place-items:center;border-radius:5px;background:var(--green);color:white}.back{color:var(--green-dark)}
		.intro{padding:3rem 0 2rem}.eyebrow{margin:0 0 .6rem;color:var(--green);font-size:.75rem;font-weight:700;text-transform:uppercase}.intro h1{margin:0;font:500 clamp(2.4rem,8vw,4rem)/1.05 'Fraunces',Georgia,serif}.intro p:last-child{color:var(--muted);line-height:1.6}
		form{display:grid;gap:1.25rem}fieldset{min-width:0;margin:0;padding:1.3rem;border:1px solid var(--line);border-radius:5px;background:var(--surface)}legend{padding:0 .4rem;font-weight:700}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.field{display:grid;gap:.4rem}.full{grid-column:1/-1}label{font-size:.85rem;font-weight:600}input,select{width:100%;min-height:2.8rem;padding:.65rem .75rem;border:1px solid #cbd4cb;border-radius:4px;background:white;color:var(--ink);font:inherit}input:focus,select:focus{outline:3px solid #e4f1e8;border-color:var(--green)}
		.hint{margin:0 0 .9rem;color:var(--muted);font-size:.85rem}.participant-list{display:grid;gap:1rem}.participant{padding-top:1rem;border-top:1px solid var(--line)}.participant h2{margin:0 0 .75rem;font-size:.9rem}.optional h2{color:var(--muted)}
		.actions{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}button{min-height:2.8rem;padding:.7rem 1.1rem;border:0;border-radius:4px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:var(--green-dark)}button:disabled{opacity:.65;cursor:wait}#status{min-height:1.4em;margin:0;color:var(--muted);font-size:.9rem}#status[data-state=error]{color:var(--coral)}
		@media(max-width:560px){.page{width:min(100% - 1.25rem,820px);padding-top:1rem}.intro{padding-top:2rem}fieldset{padding:1rem}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
	</style>
</head>
<body>
	<main class="page">
		<header class="topline"><a class="brand" href="/index.html"><span class="mark" aria-hidden="true">H</span>HackStart</a><a class="back" href="/index.html">Back to home</a></header>
		<section class="intro"><p class="eyebrow">HackStart · Team entry</p><h1>Register your team</h1><p>Enter your team lead, 3 or 4 additional participants, and your topic.</p></section>
		<form id="registrationForm">
			<fieldset><legend>Team details</legend><div class="fields">
				<div class="field full"><label for="teamName">Team name</label><input id="teamName" name="teamName" maxlength="80" required></div>
				<div class="field full"><label for="accessToken">Registration access token</label><input id="accessToken" type="password" autocomplete="off" required></div>
				<div class="field"><label for="leadName">Team lead name</label><input id="leadName" name="teamLeadName" maxlength="100" autocomplete="name" required></div>
				<div class="field"><label for="leadPhone">Team lead phone number</label><input id="leadPhone" name="teamLeadPhone" type="tel" maxlength="32" autocomplete="tel" required></div>
				<div class="field full"><label for="leadEmail">Team lead email</label><input id="leadEmail" name="teamLeadEmail" type="email" maxlength="254" autocomplete="email" required></div>
			</div></fieldset>
			<fieldset><legend>Participants</legend><p class="hint">Three participants are required. A fourth is optional.</p><div class="participant-list">
				<section class="participant"><h2>Participant 1</h2><div class="fields"><div class="field"><label for="p1name">Name</label><input id="p1name" maxlength="100" required></div><div class="field"><label for="p1phone">Phone number</label><input id="p1phone" type="tel" maxlength="32" required></div></div></section>
				<section class="participant"><h2>Participant 2</h2><div class="fields"><div class="field"><label for="p2name">Name</label><input id="p2name" maxlength="100" required></div><div class="field"><label for="p2phone">Phone number</label><input id="p2phone" type="tel" maxlength="32" required></div></div></section>
				<section class="participant"><h2>Participant 3</h2><div class="fields"><div class="field"><label for="p3name">Name</label><input id="p3name" maxlength="100" required></div><div class="field"><label for="p3phone">Phone number</label><input id="p3phone" type="tel" maxlength="32" required></div></div></section>
				<section class="participant optional"><h2>Participant 4 · Optional</h2><div class="fields"><div class="field"><label for="p4name">Name</label><input id="p4name" maxlength="100"></div><div class="field"><label for="p4phone">Phone number</label><input id="p4phone" type="tel" maxlength="32"></div></div></section>
			</div></fieldset>
			<fieldset><legend>Topic</legend><div class="field"><label for="topic">Choose a topic</label><select id="topic" required><option value="" selected disabled>Select a topic</option><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option><option value="open-track">Open track</option></select></div></fieldset>
			<div class="actions"><button id="submitButton" type="submit">Submit registration</button><p id="status" role="status" aria-live="polite"></p></div>
		</form>
	</main>
	<script>
		const form=document.querySelector("#registrationForm"),button=document.querySelector("#submitButton"),status=document.querySelector("#status");
		form.addEventListener("submit",async event=>{
			event.preventDefault();if(!form.reportValidity())return;
			const fields=[1,2,3,4].map(index=>({name:document.querySelector(`#p${index}name`).value.trim(),phone:document.querySelector(`#p${index}phone`).value.trim()}));
			if(Boolean(fields[3].name)!==Boolean(fields[3].phone)){status.dataset.state="error";status.textContent="Enter both a name and phone number for participant 4, or leave both blank.";return;}
			const payload={teamName:document.querySelector("#teamName").value.trim(),teamLead:{name:document.querySelector("#leadName").value.trim(),phone:document.querySelector("#leadPhone").value.trim(),email:document.querySelector("#leadEmail").value.trim()},participants:fields.filter(person=>person.name&&person.phone),topic:document.querySelector("#topic").value};
			button.disabled=true;status.dataset.state="";status.textContent="Submitting registration...";
			try{const response=await fetch("/api/participants",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${document.querySelector("#accessToken").value.trim()}`},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok)throw new Error(result.error||`Request failed (${response.status})`);status.textContent="Team registration submitted.";form.reset();}
			catch(error){status.dataset.state="error";status.textContent=error.message||"Could not submit registration.";}
			finally{button.disabled=false;}
		});
	</script>
</body>
</html>
